<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Tienda Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1 class="mb-5">🛒 Mini Tienda Tech</h1>
        <div class="row justify-content-center">
            {% for id, product in products.items() %}
            <div class="col-md-4 mb-4">
                <div class="card p-4 shadow-sm">
                    <h1 class="display-1">{{ product.image }}</h1>
                    <h3>{{ product.name }}</h3>
                    <p class="lead text-success fw-bold">${{ product.price }}</p>
                    <a href="/checkout/{{ id }}" class="btn btn-primary w-100">Comprar Ahora</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
